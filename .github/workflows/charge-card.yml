name: Charge Card via Gateway

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Request ID của giao dịch"
        required: true
        type: string
      telco:
        description: "Loại thẻ (VIETTEL, MOBIFONE, VINAPHONE, VIETNAMOBILE, ZING)"
        required: true
        type: string
      amount:
        description: "Mệnh giá"
        required: true
        type: string
      serial:
        description: "Số Serial"
        required: true
        type: string
      pin:
        description: "Mã thẻ"
        required: true
        type: string

jobs:
  send-card:
    runs-on: ubuntu-latest
    steps:
      - name: Send card to gateway
        env:
          PARTNER_ID: ${{ secrets.PARTNER_ID }}
          PARTNER_KEY: ${{ secrets.PARTNER_KEY }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          REQ_ID: ${{ inputs.request_id }}
          TELCO: ${{ inputs.telco }}
          AMOUNT: ${{ inputs.amount }}
          SERIAL: ${{ inputs.serial }}
          PIN: ${{ inputs.pin }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, re, urllib.request

          def clean_url(raw_val, default_val):
              s = (raw_val or "").strip()
              if not s:
                  return default_val
              m_md = re.search(r'\]\((https?://[^\s\)]+)\)', s)
              if m_md:
                  return m_md.group(1).strip()
              m_url = re.search(r'(https?://[^\s\]\)]+)', s)
              if m_url:
                  return m_url.group(1).strip()
              return s.strip("[]()\"' ")

          partner_id = (os.environ.get("PARTNER_ID") or "40469308254").strip()
          partner_key = (os.environ.get("PARTNER_KEY") or "cf555f7dc8af272291a1630bc99db30f").strip()
          gateway_url = clean_url(os.environ.get("GATEWAY_URL", ""), "https://gachthe99.com/chargingws/v2")
          callback_url = clean_url(os.environ.get("CALLBACK_URL", ""), "https://shopmunbell.byethost32.com/callback_the.php")

          req_id = os.environ["REQ_ID"].strip()
          telco = os.environ["TELCO"].strip().upper()
          amount = int(os.environ["AMOUNT"].strip())
          serial = os.environ["SERIAL"].strip()
          pin = os.environ["PIN"].strip()

          sign = hashlib.md5(f"{partner_key}{pin}{serial}".encode("utf-8")).hexdigest()

          payload = {
              "telco": telco,
              "code": pin,
              "serial": serial,
              "amount": amount,
              "request_id": req_id,
              "partner_id": partner_id,
              "api_key": partner_key,
              "sign": sign,
              "command": "charging",
              "callback": callback_url
          }

          req = urllib.request.Request(
              gateway_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Mozilla/5.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=25) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
                  print("HTTP_STATUS:", resp.status)
                  print("GATEWAY_RESPONSE:", raw)
          except Exception as e:
              print("GATEWAY_ERROR:", repr(e))
              raise
          EOF
