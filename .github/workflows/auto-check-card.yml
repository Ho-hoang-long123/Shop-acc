name: Auto Check Cards

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fast poll card verification endpoint
        env:
          CHECK_URL: ${{ secrets.CARD_CHECK_URL }}
          CHECK_KEY: ${{ secrets.CARD_CHECK_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CHECK_URL:-}" ] || [ -z "${CHECK_KEY:-}" ]; then
            echo "Thiếu CARD_CHECK_URL hoặc CARD_CHECK_KEY trong GitHub Secrets"
            exit 1
          fi

          INTERVAL=15
          MAX_LOOPS=56

          for ((i=1; i<=MAX_LOOPS; i++)); do
            echo "=== Lượt $i/$MAX_LOOPS ($(date -u '+%H:%M:%S UTC')) ==="
            BODY_FILE="$(mktemp)"

            set +e
            HTTP_CODE=$(curl -sS -L \
              --connect-timeout 6 \
              --max-time 12 \
              -o "$BODY_FILE" \
              -w "%{http_code}" \
              -X POST "$CHECK_URL" \
              -H "X-Cron-Key: $CHECK_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "User-Agent: Mozilla/5.0" \
              --data-urlencode "key=$CHECK_KEY")
            CURL_EXIT=$?
            set -e

            echo "curl_exit=$CURL_EXIT | http_code=$HTTP_CODE"
            cat "$BODY_FILE" || true
            echo ""
            rm -f "$BODY_FILE"

            if [ "$i" -lt "$MAX_LOOPS" ]; then
              sleep "$INTERVAL"
            fi
          done
          
