name: Sync Pending Cards

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sync endpoint
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
        run: |
          curl -sS -m 20 "${CALLBACK_URL}?sync=1&token=${PROXY_SECRET}" || true
