<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEAM STORE - MARKETPLACE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --steam-bg: #1b2838;
            --steam-dark: #171a21;
            --steam-card: #2a475e;
            --steam-accent: #66c0f4;
            --steam-green: #5c7e10;
            --text-main: #c7d5e0;
            --text-white: #ffffff;
            --border-color: #384959;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--steam-bg); color: var(--text-main); line-height: 1.5; }

        header { background-color: var(--steam-dark); border-bottom: 1px solid #000; padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 1.3rem; font-weight: bold; color: var(--text-white); text-decoration: none; }
        .logo span { color: var(--steam-accent); }
        .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .btn { padding: 8px 14px; border: none; border-radius: 2px; font-weight: 600; cursor: pointer; font-size: 0.8rem; text-transform: uppercase; color: white; }
        .btn-steam { background-color: var(--steam-green); }
        .btn-blue { background-color: #2a475e; border: 1px solid var(--steam-accent); color: var(--steam-accent); }
        .btn-danger { background-color: #a32d2d; }

        .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
        .section-title { font-size: 1.1rem; color: var(--text-white); text-transform: uppercase; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; }

        .acc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .acc-card { background-color: #16202d; border: 1px solid #000; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
        .acc-img { width: 100%; height: 130px; object-fit: cover; background: #000; }
        .acc-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .acc-title { font-size: 0.95rem; font-weight: bold; color: var(--text-white); margin-bottom: 6px; }
        .acc-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 8px; }
        .acc-price { font-size: 0.95rem; font-weight: bold; color: #beee11; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
        .modal.active { display: flex !important; }
        .modal-content { background: #1b2838; border: 1px solid var(--border-color); width: 100%; max-width: 400px; padding: 20px; border-radius: 4px; position: relative; }
        .modal-close { position: absolute; top: 10px; right: 15px; font-size: 1.2rem; cursor: pointer; color: #8f98a0; }
        .form-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 0.8rem; color: #8f98a0; }
        input { background-color: #316282; border: 1px solid #000; color: white; padding: 8px; border-radius: 2px; outline: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">🎮 STEAM <span>MARKET</span></a>
            <div class="nav-links">
                <div id="guestButtons">
                    <button class="btn btn-blue" onclick="openAuthModal('login')">Đăng Nhập</button>
                    <button class="btn btn-steam" onclick="openAuthModal('register')">Đăng Ký</button>
                </div>
                <div id="userButtons" class="hidden" style="display: flex; align-items: center; gap: 6px;">
                    <span id="displayUsername" style="color: #66c0f4; font-weight: bold;">User</span>
                    <button class="btn btn-danger" onclick="logout()">Thoát</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="section-title">🔥 KHO TÀI KHOẢN STEAM</div>
        <div class="acc-grid" id="accGrid">
            <p style="color: #8f98a0;">Đang tải danh sách acc...</p>
        </div>
    </div>

    <!-- MODAL AUTH -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('authModal')">&times;</span>
            <h3 id="modalTitle" style="color: white; margin-bottom: 12px;">Đăng Nhập</h3>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group"><label>Tài khoản</label><input type="text" id="authUser" required></div>
                <div class="form-group"><label>Mật khẩu</label><input type="password" id="authPass" required></div>
                <button type="submit" class="btn btn-steam" style="width: 100%; margin-top: 10px;" id="authSubmitBtn">Đăng Nhập</button>
            </form>
            <p id="switchText" style="font-size: 0.8rem; color: #8f98a0; margin-top: 10px; text-align: center; cursor: pointer;" onclick="toggleAuthMode()">Chưa có tài khoản? Đăng ký ngay</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xuzboadnalqcbpjbjpom.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5h8MwoYcm93JNFqUoModUA_aucynQk6';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLoginMode = true;
        let currentUser = JSON.parse(localStorage.getItem('steam_user')) || null;

        function init() {
            updateUI();
            loadDummyAccounts();
        }

        function loadDummyAccounts() {
            document.getElementById('accGrid').innerHTML = `
                <div class="acc-card">
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f" class="acc-img">
                    <div class="acc-body">
                        <div>
                            <div class="acc-title">CS2 Prime + 10 Games</div>
                            <div style="font-size: 0.75rem; color: #8f98a0;">Level 10, Không VAC</div>
                        </div>
                        <div class="acc-footer">
                            <div class="acc-price">50.000đ</div>
                            <button class="btn btn-steam" onclick="alert('Đăng nhập để mua!')">Mua</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function openAuthModal(mode) {
            isLoginMode = (mode === 'login');
            document.getElementById('modalTitle').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký Ngay";
            document.getElementById('switchText').innerText = isLoginMode ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
            document.getElementById('authModal').classList.add('active');
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('modalTitle').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký Ngay";
            document.getElementById('switchText').innerText = isLoginMode ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const u = document.getElementById('authUser').value.trim();
            const p = document.getElementById('authPass').value.trim();

            if (isLoginMode) {
                if (u === "hoanglong19523" && p === "Long1510@") {
                    currentUser = { id: u, username: u };
                    localStorage.setItem('steam_user', JSON.stringify(currentUser));
                    closeModal('authModal');
                    updateUI();
                    alert("Đăng nhập Admin thành công!");
                    return;
                }

                const { data, error } = await client.from('profiles').select('*').eq('id', u).eq('password', p).single();
                if (error || !data) {
                    alert("Sai tài khoản hoặc mật khẩu!");
                    return;
                }
                currentUser = data;
                localStorage.setItem('steam_user', JSON.stringify(currentUser));
                closeModal('authModal');
                updateUI();
                alert("Đăng nhập thành công!");
            } else {
                const { error } = await client.from('profiles').insert([{ id: u, password: p, balance: 0 }]);
                if (error) {
                    alert("Tài khoản đã tồn tại hoặc lỗi kết nối!");
                    return;
                }
                alert("Đăng ký thành công! Hãy đăng nhập.");
                isLoginMode = true;
                openAuthModal('login');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('steam_user');
            updateUI();
        }

        function updateUI() {
            if (currentUser) {
                document.getElementById('guestButtons').classList.add('hidden');
                document.getElementById('userButtons').classList.remove('hidden');
                document.getElementById('displayUsername').innerText = currentUser.username || currentUser.id;
            } else {
                document.getElementById('guestButtons').classList.remove('hidden');
                document.getElementById('userButtons').classList.add('hidden');
            }
        }

        init();
    </script>
</body>
</html>
